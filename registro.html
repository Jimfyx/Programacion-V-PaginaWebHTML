<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>

    <header>
        <h1>Registro de Usuarios</h1>
    </header>

    <main>
        <p><h2>Llena los campos que se solicitan para poder registrarte</h2></p>
        <form action="sesion.html" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
            <br>
            <br>
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electronico" required>
            <br>
            <br>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingrese una contraseña" required>
            <br>
            <br>
            <label for="direccion">Dirección:</label>
            <textarea id="direccion" name="direccion" placeholder="Ingrese su direccion" required></textarea>
            <br>
            <br>
            <label for="genero">Genero:</label>
            <select id="genero" name="genero">
                <option value="male">Masculino</option>
                <option value="female">Femenino</option>
            </select>
            <br>
            <br>
            <button type="submit">Registrarse</button>
        </form>
    </main>

    <footer>
        <p>Derechos reservados@ 2025</p>
    </footer>
    
</body>
</html>
