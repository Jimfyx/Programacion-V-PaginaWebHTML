<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
</head>
<body>
    
    <header>
        <h1>Pantalla de Inicio de Sesion</h1>
    </header>

    <main>
        <p><h2>Completa los datos para iniciar sesion</h2></p>
        <form action="perfil.html" method="post">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electronico" required>
            <br>
            <br>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingrese una contraseña" required>
            <br>
            <br>
            <button type="submit">Iniciar Sesion</button>
        </form>

        <p>Aun no tienes cuenta? <a href="registro.html">haz click aqui para registrarte</a></p>
    </main>

    <footer>
        <p>Derechos reservados@ 2025</p>
    </footer>
</body>
</html>
